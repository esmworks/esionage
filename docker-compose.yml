services:
  # Bundled PostgreSQL, started only while COMPOSE_PROFILES includes `bundled-db` (see .env.example).
  # To use an external database instead, drop the profile and set EXTERNAL_DATABASE_URL.
  db:
    image: postgres:18-alpine
    profiles: [bundled-db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: esionage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esionage}
      POSTGRES_DB: esionage
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esionage"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Prebuilt image from GitHub Container Registry; `docker compose up --build` builds from source instead.
    image: ghcr.io/esmworks/esionage:${ESIONAGE_VERSION:-latest}
    build: .
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Not DATABASE_URL: in .env that one points at localhost for `pnpm dev`.
      DATABASE_URL: ${EXTERNAL_DATABASE_URL:-postgres://esionage:${POSTGRES_PASSWORD:-esionage}@db:5432/esionage}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-1}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Uploaded files: the `uploads` volume below unless S3_BUCKET points at S3-compatible storage.
      UPLOAD_DIR: /app/data/uploads
      UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-}
      UPLOAD_WORKSPACE_QUOTA_MB: ${UPLOAD_WORKSPACE_QUOTA_MB:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
      EXPORT_MAX_PAGES: ${EXPORT_MAX_PAGES:-}
      EXPORT_MAX_FILES_MB: ${EXPORT_MAX_FILES_MB:-}
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
