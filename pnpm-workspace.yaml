allowBuilds:
  esbuild: true
  sharp: true
  # Only needed by next-intl's message extractor, which we don't use.
  '@parcel/watcher': false
  '@swc/core': false
  # Pulled in by the AI library (pi-ai); their install scripts are no-ops or version notices.
  '@google/genai': false
  protobufjs: false
  # ESLint's TypeScript import resolver; its native binary comes as an optional package, the
  # script only fetches one when that is missing.
  unrs-resolver: false
