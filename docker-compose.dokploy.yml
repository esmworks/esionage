# Dokploy: create a Compose service from this repository and set its compose path to
# ./docker-compose.dokploy.yml. Dokploy builds the image from source on every deploy.
# No host ports are published (Dokploy itself uses port 3000); add a domain in Dokploy
# pointing to service `app`, port 3000. Keep the services in sync with docker-compose.yml.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: esionage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (openssl rand -hex 24)}
      POSTGRES_DB: esionage
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esionage"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL:?Set APP_URL to the public origin, e.g. https://notes.example.com}
      DATABASE_URL: postgres://esionage:${POSTGRES_PASSWORD}@db:5432/esionage
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (openssl rand -base64 32)}
    expose:
      - "3000"

volumes:
  pgdata:
